[package]
name = "rat-squad"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["LecherousCthulhu"]
description = "Multi-agent AI squad manager for ratterm - run multiple AI coding agents in parallel"
license = "AGPL-3.0"
readme = "README.md"
repository = "https://github.com/hastur-dev/rat-squad"
keywords = ["ratterm", "extension", "ai", "agent", "tmux"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# HTTP client for ratterm REST API and AI providers
reqwest = { version = "0.12", features = ["json", "blocking"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# Async runtime
tokio = { version = "1.0", features = ["full"] }
# Async trait support
async-trait = "0.1"
# Error handling
thiserror = "2.0"
anyhow = "1.0"
# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI parsing
clap = { version = "4.0", features = ["derive"] }
# UUID for session IDs
uuid = { version = "1.0", features = ["v4"] }
# Directory management
dirs = "6.0"
# Time handling
chrono = { version = "0.4", features = ["serde"] }
# Regex for parsing
regex = "1.0"

[dev-dependencies]
# Testing
proptest = "1.0"
mockall = "0.13"
tempfile = "3.0"
wiremock = "0.6"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "rat-squad"
path = "src/main.rs"
